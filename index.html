<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- تحديد الاتجاه فوراً قبل تحميل React لتجنب وميض القائمة عند pull-to-refresh -->
    <script>
      (function(){
        try {
          var lang = localStorage.getItem('noorix-lang') || 'ar';
          var d = document.documentElement;
          if (lang === 'en') {
            d.setAttribute('dir', 'ltr');
            d.setAttribute('lang', 'en');
          } else {
            d.setAttribute('dir', 'rtl');
            d.setAttribute('lang', 'ar');
          }
        } catch(e) {}
      })();
    </script>
    <title>نووريكس — Noorix</title>

    <!-- Viewport & PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="نووريكس" />
    <meta name="application-name" content="نووريكس" />
    <meta name="theme-color" content="#0a1f44" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1524" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#0a1f44" />
    <meta name="msapplication-config" content="none" />

    <!-- SEO -->
    <meta name="description" content="نووريكس — نظام إدارة متكامل للمبيعات والمحاسبة والموارد البشرية" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Safe area for notched devices (handled via CSS) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
