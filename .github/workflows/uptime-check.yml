# مراقبة جاهزية الـ API من الإنترنت (لا يعتمد على السيرفر)
# — فشل الـ job يظهر في GitHub (ويمكن تفعيل إشعار البريد من إعدادات المستودع)
# — يعيد المحاولة 3 مرات لموجات عابرة
name: Uptime (hajrix.com API)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime-hajrix
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/v1/health (readiness — 200 و status=ok | 503 عند تعطّل DB)
        run: |
          set -e
          ok=0
          for i in 1 2 3; do
            if curl -sS -f --max-time 28 "https://hajrix.com/api/v1/health" -o /tmp/h.json; then
              ok=1
              break
            fi
            echo "Attempt $i failed, retrying..." >&2
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "All retries failed" >&2
            exit 1
          fi
          head -c 600 /tmp/h.json
          echo ""
