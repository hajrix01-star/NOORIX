# نشر الواجهة والخلفية — Self-Hosted Runner على الـ VPS مباشرة
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  لماذا self-hosted وليس SSH؟
#  GitHub Actions (ubuntu-latest) تعمل على Azure بعناوين IP متغيرة
#  يحجبها جدار الـ VPS بشكل صحيح. الحل: نثبّت الـ Runner على الـ VPS
#  نفسه → يسحب المهام من GitHub (اتصال صادر لا يُحجب) ويُنفّذها محلياً
#  بدون أي SSH من الخارج.
#
#  الإعداد الأولي (مرة واحدة — 5 دقائق):
#  ┌─────────────────────────────────────────────────────────┐
#  │ 1. على GitHub: Settings → Actions → Runners             │
#  │    → New self-hosted runner → Linux → x64               │
#  │    ستظهر لك 3 أوامر — شغّلها على الـ VPS               │
#  │                                                          │
#  │ 2. على الـ VPS (بعد تنزيل الـ runner):                  │
#  │    ./config.sh --url <repo_url> --token <TOKEN>          │
#  │                                                          │
#  │ 3. تثبيت كخدمة تعمل تلقائياً عند إعادة التشغيل:        │
#  │    sudo ./svc.sh install && sudo ./svc.sh start          │
#  │                                                          │
#  │ 4. تأكد أن مستخدم الـ runner يستطيع:                    │
#  │    - rsync + قراءة/كتابة في /var/www/noorix              │
#  │    - sudo bash deploy/install-frontend.sh (بدون كلمة)    │
#  │    - sudo systemctl reload nginx (بدون كلمة)             │
#  │    مثال: sudo visudo ثم أضف:                             │
#  │    runner ALL=(ALL) NOPASSWD: /bin/bash, /bin/systemctl  │
#  └─────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Deploy React Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-noorix-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── بناء الواجهة ─────────────────────────────────────
      - name: Build frontend
        run: |
          npm ci
          npm run build
        env:
          CI: false
          VITE_BUILD_ID: ${{ github.sha }}

      # ── نشر الواجهة إلى مجلد Nginx ──────────────────────
      - name: Deploy frontend to Nginx root
        run: |
          tar czf /tmp/noorix-frontend.tar.gz -C dist .
          sudo bash deploy/install-frontend.sh /tmp/noorix-frontend.tar.gz "${{ github.sha }}"
          rm -f /tmp/noorix-frontend.tar.gz

      # ── تحديث الخلفية وإعادة بنائها في مسار الإنتاج ────
      # البناء يتم أولاً وPM2 يبقى شغّالاً. بعد اكتمال dist/ نحذف العملية القديمة
      # ونُنشئ جديدة — أكثر موثوقية من startOrReload في وضع cluster.
      - name: Sync backend to production path & rebuild
        run: |
          PROD=/var/www/noorix/backend
          WORKSPACE="${{ github.workspace }}"

          # دالة إسعاف: إذا فشل البناء نُعيد تشغيل PM2 بالـ dist القديم (إن وُجد)
          ensure_pm2_running() {
            echo "==> [trap] خطأ — نُعيد تشغيل PM2 بالكود السابق إن أمكن"
            pm2 delete noorix-api noorix-backend 2>/dev/null || true
            pm2 start "$PROD/ecosystem.config.cjs" 2>/dev/null || true
            pm2 save 2>/dev/null || true
          }
          trap ensure_pm2_running ERR

          echo "==> مزامنة كود الخلفية (بدون node_modules/dist/.env)"
          rsync -a --delete \
            --exclude='node_modules' --exclude='dist' --exclude='.env' \
            backend/ "$PROD/"

          echo "==> مزامنة سكريبتات النشر (deploy/) للسيرفر"
          mkdir -p /var/www/noorix/deploy
          rsync -a deploy/ /var/www/noorix/deploy/

          cd "$PROD"

          echo "==> تنظيف node_modules القديمة لضمان npm ci نظيف"
          rm -rf node_modules

          echo "==> npm ci (PM2 لا يزال يعمل بالـ dist القديم)"
          npm ci

          echo "==> prisma generate"
          npx prisma generate \
            || (sleep 5; npx prisma generate) \
            || (sleep 5; npx prisma generate)

          echo "==> prisma migrate deploy"
          bash "$WORKSPACE/deploy/prisma-migrate-deploy-with-recovery.sh"

          echo "==> backfill sales shift from notes (legacy rows)"
          node scripts/backfill-sales-shift-from-notes.mjs || echo "WARN: shift backfill skipped/failed"

          echo "==> تنظيف TypeScript incremental cache قبل البناء (يمنع أخطاء stale tsbuildinfo)"
          rm -f dist/tsconfig.build.tsbuildinfo 2>/dev/null || true

          echo "==> npm run build"
          npm run build

          echo "==> إيقاف كل عمليات Noorix API القديمة وتشغيل نسخة جديدة"
          pm2 delete noorix-api noorix-backend 2>/dev/null || true
          sleep 2
          DEPLOY_SHA="${{ github.sha }}" pm2 start ecosystem.config.cjs

          echo "==> pm2 save"
          pm2 save

      # ── انتظار جاهزية الـ API ─────────────────────────────
      - name: Wait for API liveness
        run: |
          API_PORT=3000
          if [ -f /var/www/noorix/backend/.env ]; then
            p=$(sed -n 's/^[[:space:]]*PORT[[:space:]]*=[[:space:]]*//p' \
              /var/www/noorix/backend/.env | head -1 | tr -d '\r')
            p=$(echo "$p" | tr -d '[:space:]')
            case "$p" in ''|*[!0-9]*) ;; *) API_PORT=$p ;; esac
          fi
          echo "==> API_PORT=${API_PORT} (يجب أن يطابق Nginx proxy_pass)"
          echo "==> Waiting for liveness on port ${API_PORT}..."
          ready=0
          for i in $(seq 1 90); do
            if curl -sS -f -o /dev/null --connect-timeout 2 --max-time 3 \
                "http://127.0.0.1:${API_PORT}/api/v1/health/live" 2>/dev/null; then
              echo "==> API ready after ${i}s"
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "ERROR: timeout 90s" >&2
            pm2 logs noorix-backend --lines 80 --nostream 2>&1 | tail -80
            exit 1
          fi

      - name: Verify PM2 restarted and Saudi occasions route exists
        run: |
          API_PORT=3000
          if [ -f /var/www/noorix/backend/.env ]; then
            p=$(sed -n 's/^[[:space:]]*PORT[[:space:]]*=[[:space:]]*//p' \
              /var/www/noorix/backend/.env | head -1 | tr -d '\r')
            p=$(echo "$p" | tr -d '[:space:]')
            case "$p" in ''|*[!0-9]*) ;; *) API_PORT=$p ;; esac
          fi
          LIVE_JSON="$(curl -sS --max-time 5 "http://127.0.0.1:${API_PORT}/api/v1/health/live" || true)"
          echo "live: ${LIVE_JSON}"
          UPTIME="$(echo "$LIVE_JSON" | sed -n 's/.*"uptimeSec":\([0-9]*\).*/\1/p')"
          if [ -n "$UPTIME" ] && [ "$UPTIME" -gt 600 ]; then
            echo "WARN: uptimeSec=${UPTIME} — PM2 may not have restarted; forcing reload"
            pm2 delete noorix-api noorix-backend 2>/dev/null || true
            sleep 2
            cd /var/www/noorix/backend
            DEPLOY_SHA="${{ github.sha }}" pm2 start ecosystem.config.cjs
            pm2 save
            sleep 5
          fi
          CODE="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 \
            "http://127.0.0.1:${API_PORT}/api/v1/dashboard/calendar/saudi-occasions?year=2026" || echo 000)"
          echo "saudi-occasions HTTP ${CODE} (expect 401/403, not 404)"
          if [ "$CODE" = "404" ]; then
            echo "ERROR: route missing after deploy — run deploy/repair-api-on-vps.sh on VPS" >&2
            pm2 list
            exit 1
          fi

      # ── إعادة تحميل Nginx وفحص نهائي ─────────────────────
      - name: Reload Nginx & final health check
        run: |
          sudo systemctl reload nginx
          echo "==> Public health check..."
          curl -sS -f --max-time 30 "https://hajrix.com/api/v1/health" | head -c 500
          echo ""
          echo "==> Deployment completed successfully."
