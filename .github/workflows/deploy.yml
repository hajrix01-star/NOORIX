# نشر الواجهة — Tailscale VPN → SCP → سكربت على السيرفر
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  لماذا Tailscale؟
#  GitHub Actions تعمل على Azure بعناوين IP ديناميكية متغيرة.
#  فتح منفذ 22 للعموم خطر؛ وإضافة 200+ CIDR كل أسبوع غير عملي.
#  Tailscale تُنشئ نفقاً WireGuard خاصاً: الـ runner ينضم للشبكة
#  ثم يصل للـ VPS على عنوانه الداخلي دون فتح أي منفذ عام.
#
#  الإعداد الأولي (مرة واحدة):
#  1. على الـ VPS:
#       curl -fsSL https://tailscale.com/install.sh | sh
#       sudo tailscale up --authkey=<TSKEY> --advertise-tags=tag:server
#       sudo systemctl enable --now tailscaled
#     ثم: tailscale status  ← احفظ الاسم/IP الظاهر (مثال: 100.64.1.5)
#
#  2. في Tailscale Admin Console:
#       Settings → OAuth Clients → New Client
#       Scope: devices:write | Tag: tag:ci
#       احفظ Client ID + Secret
#
#  3. في GitHub repo → Settings → Secrets → Actions:
#       TS_OAUTH_CLIENT_ID    = <OAuth Client ID>
#       TS_OAUTH_SECRET       = <OAuth Client Secret>
#       VPS_TS_HOST           = <Tailscale IP أو اسم VPS مثال 100.64.1.5>
#       VPS_HOST              = <النطاق العام hajrix.com — للفحص النهائي فقط>
#       VPS_USERNAME          = <اسم المستخدم على VPS>
#       VPS_SSH_KEY           = <المفتاح الخاص SSH>
#       VPS_SSH_PORT          = <منفذ SSH إن لم يكن 22 — اختياري>
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Deploy React Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-noorix-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          CI: false
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Pack frontend tarball
        run: tar czf noorix-frontend.tar.gz -C dist .

      # ── الاتصال بـ Tailscale قبل SSH ───────────────────────
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      # ── النشر عبر SSH (من خلال نفق Tailscale) ─────────────
      - name: Upload tarball and remote install
        env:
          VPS_TS_HOST: ${{ secrets.VPS_TS_HOST }}
          VPS_HOST:    ${{ secrets.VPS_HOST }}
          VPS_USER:    ${{ secrets.VPS_USERNAME }}
          VPS_KEY:     ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT:    ${{ secrets.VPS_SSH_PORT }}
          DEPLOY_SHA:  ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_TS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_KEY:-}" ]; then
            echo "ERROR: يجب ضبط: VPS_TS_HOST / VPS_USERNAME / VPS_SSH_KEY في GitHub Secrets."
            echo "       راجع تعليمات الإعداد في أعلى ملف deploy.yml"
            exit 1
          fi

          PORT="$(printf '%s' "${VPS_PORT:-22}" | tr -d '[:space:]\r')"
          if [ -z "$PORT" ]; then PORT=22; fi

          mkdir -p ~/.ssh
          KEY="$HOME/.ssh/noorix_ci_deploy_key"
          printf '%s\n' "$VPS_KEY" > "$KEY"
          chmod 600 "$KEY"

          SCP_OPTS=( -o BatchMode=yes -o StrictHostKeyChecking=accept-new
                     -o ServerAliveInterval=20 -o ServerAliveCountMax=12
                     -o TCPKeepAlive=yes     -o ConnectTimeout=30
                     -i "$KEY" -P "$PORT" )
          SSH_OPTS=( -o BatchMode=yes -o StrictHostKeyChecking=accept-new
                     -o ServerAliveInterval=20 -o ServerAliveCountMax=12
                     -o TCPKeepAlive=yes     -o ConnectTimeout=30
                     -i "$KEY" -p "$PORT" )

          # ── SCP: أرشيف الواجهة ───────────────────────────
          for attempt in $(seq 1 5); do
            echo "==> SCP attempt ${attempt}/5 → ${VPS_TS_HOST}:/tmp/"
            if scp "${SCP_OPTS[@]}" noorix-frontend.tar.gz "${VPS_USER}@${VPS_TS_HOST}:/tmp/"; then
              echo "==> SCP OK"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: SCP failed after 5 attempts."
              exit 1
            fi
            echo "  sleeping 20s before retry..."
            sleep 20
          done

          # ── SSH: تثبيت الواجهة + migrate + pm2 restart ──
          for attempt in $(seq 1 4); do
            echo "==> Remote install attempt ${attempt}/4"
            if [ "$attempt" -gt 1 ]; then
              echo "==> Re-SCP tarball (retry after failure)"
              scp "${SCP_OPTS[@]}" noorix-frontend.tar.gz "${VPS_USER}@${VPS_TS_HOST}:/tmp/" || {
                echo "ERROR: re-SCP failed"
                [ "$attempt" -eq 4 ] && exit 1
                sleep 20; continue
              }
            fi
            if ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_TS_HOST}" \
                "export DEPLOY_SHA='${DEPLOY_SHA}'; bash -s" < deploy/ci-remote-install.sh; then
              echo "==> Deployment completed."
              exit 0
            fi
            [ "$attempt" -eq 4 ] && { echo "ERROR: Remote install failed after 4 attempts."; exit 1; }
            echo "  sleeping 30s..."
            sleep 30
          done
          echo "ERROR: deploy loop ended without success."
          exit 1
