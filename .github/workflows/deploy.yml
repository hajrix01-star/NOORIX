name: Deploy React Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          CI: false

      - name: Install and build HAJRI TAX (tax-hajri)
        working-directory: tax-hajri
        run: npm ci && npm run build
        env:
          CI: false
          VITE_BASE_PATH: /tax/
          VITE_TAX_APP_ID: ${{ secrets.VITE_TAX_APP_ID }}
          VITE_TAX_APP_BASE_URL: ${{ secrets.VITE_TAX_APP_BASE_URL }}
          VITE_TAX_FUNCTIONS_VERSION: ${{ secrets.VITE_TAX_FUNCTIONS_VERSION }}

      # فرض IPv4 يقلّل أعطال "i/o timeout" عندما يحاول الـ runner الاتصال عبر IPv6 وفشل المسار.
      # إذا كان SSH على منفذ غير 22: أضف Secret باسم VPS_SSH_PORT بقيمة المنفذ (مثلاً 2222).
      - name: Deploy to VPS (SCP)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          protocol: tcp4
          timeout: 3m
          command_timeout: 15m
          source: 'dist/*'
          target: '/var/www/hajrix.com/'
          strip_components: 1

      - name: Deploy HAJRI TAX to VPS (rsync)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USERNAME }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -e
          PORT="${PORT:-22}"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_tax_key
          chmod 600 ~/.ssh/deploy_tax_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_tax_key -p $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts" \
            tax-hajri/dist/ "$USER@$HOST:/var/www/hajrix.com/tax/"

      - name: Backend pull, migrate, build, PM2 + reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          protocol: tcp4
          timeout: 3m
          command_timeout: 25m
          script: |
            set -e
            if [ -d /var/www/noorix ]; then
              cd /var/www/noorix
              git pull origin main
              (cd backend && rm -rf node_modules && npm ci && npx prisma generate && npx prisma migrate deploy && npm run build)
              (cd backend && pm2 startOrReload ecosystem.config.cjs --update-env)
              pm2 restart hajri-menu --update-env 2>/dev/null || true
            fi
            sudo systemctl reload nginx
            echo "Deployment completed successfully!"
