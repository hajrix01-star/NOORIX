# نشر الواجهة والخلفية — Self-Hosted Runner على الـ VPS مباشرة
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  لماذا self-hosted وليس SSH؟
#  GitHub Actions (ubuntu-latest) تعمل على Azure بعناوين IP متغيرة
#  يحجبها جدار الـ VPS بشكل صحيح. الحل: نثبّت الـ Runner على الـ VPS
#  نفسه → يسحب المهام من GitHub (اتصال صادر لا يُحجب) ويُنفّذها محلياً
#  بدون أي SSH من الخارج.
#
#  الإعداد الأولي (مرة واحدة — 5 دقائق):
#  ┌─────────────────────────────────────────────────────────┐
#  │ 1. على GitHub: Settings → Actions → Runners             │
#  │    → New self-hosted runner → Linux → x64               │
#  │    ستظهر لك 3 أوامر — شغّلها على الـ VPS               │
#  │                                                          │
#  │ 2. على الـ VPS (بعد تنزيل الـ runner):                  │
#  │    ./config.sh --url <repo_url> --token <TOKEN>          │
#  │                                                          │
#  │ 3. تثبيت كخدمة تعمل تلقائياً عند إعادة التشغيل:        │
#  │    sudo ./svc.sh install && sudo ./svc.sh start          │
#  │                                                          │
#  │ 4. تأكد أن مستخدم الـ runner يستطيع:                    │
#  │    - rsync + قراءة/كتابة في /var/www/noorix              │
#  │    - sudo bash deploy/install-frontend.sh (بدون كلمة)    │
#  │    - sudo systemctl reload nginx (بدون كلمة)             │
#  │    - sudo systemd-run (لتشغيل PM2 بعيداً عن دورة الـ job) │
#  │    مثال: sudo visudo ثم أضف:                             │
#  │    runner ALL=(ALL) NOPASSWD: /bin/bash, /bin/systemctl  │
#  │
#  │ ⚠️ الـ runner يقتل عمليات PM2/node عند انتهاء المهمة     │
#  │    (orphan cleanup). لذلك إعادة تشغيل API تتم عبر        │
#  │    systemd-run — انظر deploy/restart-api-detached.sh     │
#  └─────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Deploy React Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-noorix-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── بناء الواجهة ─────────────────────────────────────
      - name: Build frontend
        run: |
          npm ci
          npm run build
        env:
          CI: false
          VITE_BUILD_ID: ${{ github.sha }}

      # ── نشر الواجهة إلى مجلد Nginx ──────────────────────
      - name: Deploy frontend to Nginx root
        run: |
          tar czf /tmp/noorix-frontend.tar.gz -C dist .
          sudo bash deploy/install-frontend.sh /tmp/noorix-frontend.tar.gz "${{ github.sha }}"
          rm -f /tmp/noorix-frontend.tar.gz

      # ── تحديث الخلفية وإعادة بنائها في مسار الإنتاج ────
      # البناء يتم أولاً وPM2 يبقى شغّالاً. بعد اكتمال dist/ نحذف العملية القديمة
      # ونُنشئ جديدة — أكثر موثوقية من startOrReload في وضع cluster.
      - name: Sync backend to production path & rebuild
        run: |
          PROD=/var/www/noorix/backend
          WORKSPACE="${{ github.workspace }}"

          # إسعاف: إعادة تشغيل API عبر systemd-run (لا تُقتل عند انتهاء الـ job)
          recover_api_detached() {
            echo "==> [trap] خطأ — إعادة تشغيل API (detached)"
            export DEPLOY_SHA="${{ github.sha }}"
            bash "$WORKSPACE/deploy/restart-api-detached.sh" || true
          }
          trap recover_api_detached ERR

          echo "==> مزامنة كود الخلفية (بدون node_modules/dist/.env)"
          rsync -a --delete \
            --exclude='node_modules' --exclude='dist' --exclude='.env' \
            backend/ "$PROD/"

          echo "==> مزامنة سكريبتات النشر (deploy/) للسيرفر"
          mkdir -p /var/www/noorix/deploy
          rsync -a deploy/ /var/www/noorix/deploy/

          cd "$PROD"

          echo "==> تنظيف node_modules القديمة لضمان npm ci نظيف"
          rm -rf node_modules

          echo "==> npm ci (PM2 لا يزال يعمل بالـ dist القديم)"
          npm ci

          echo "==> prisma generate"
          npx prisma generate \
            || (sleep 5; npx prisma generate) \
            || (sleep 5; npx prisma generate)

          echo "==> prisma migrate deploy"
          bash "$WORKSPACE/deploy/prisma-migrate-deploy-with-recovery.sh"

          echo "==> backfill sales shift from notes (legacy rows)"
          node scripts/backfill-sales-shift-from-notes.mjs || echo "WARN: shift backfill skipped/failed"

          echo "==> تنظيف TypeScript incremental cache قبل البناء (يمنع أخطاء stale tsbuildinfo)"
          rm -f dist/tsconfig.build.tsbuildinfo 2>/dev/null || true

          echo "==> npm run build"
          npm run build

          echo "==> التحقق من وجود مسار saudi-occasions في dist"
          if ! grep -rq 'saudi-occasions' "$PROD/dist/dashboard/"; then
            echo "ERROR: dist built without saudi-occasions route" >&2
            exit 1
          fi

      # PM2 يُشغَّل عبر systemd-run — وإلا يقتله الـ runner عند "Complete job"
      - name: Restart API (detached from runner orphan cleanup)
        run: |
          export DEPLOY_SHA="${{ github.sha }}"
          bash "${{ github.workspace }}/deploy/restart-api-detached.sh" --wait-public

      # ── إعادة تحميل Nginx وفحص نهائي ─────────────────────
      - name: Reload Nginx & final health check
        run: |
          sudo systemctl reload nginx
          echo "==> Public health check..."
          curl -sS -f --max-time 30 "https://hajrix.com/api/v1/health" | head -c 500
          echo ""
          echo "==> Deployment completed successfully."
