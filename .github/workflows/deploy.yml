# نشر الواجهة والخلفية — Self-Hosted Runner على الـ VPS مباشرة
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  لماذا self-hosted وليس SSH؟
#  GitHub Actions (ubuntu-latest) تعمل على Azure بعناوين IP متغيرة
#  يحجبها جدار الـ VPS بشكل صحيح. الحل: نثبّت الـ Runner على الـ VPS
#  نفسه → يسحب المهام من GitHub (اتصال صادر لا يُحجب) ويُنفّذها محلياً
#  بدون أي SSH من الخارج.
#
#  الإعداد الأولي (مرة واحدة — 5 دقائق):
#  ┌─────────────────────────────────────────────────────────┐
#  │ 1. على GitHub: Settings → Actions → Runners             │
#  │    → New self-hosted runner → Linux → x64               │
#  │    ستظهر لك 3 أوامر — شغّلها على الـ VPS               │
#  │                                                          │
#  │ 2. على الـ VPS (بعد تنزيل الـ runner):                  │
#  │    ./config.sh --url <repo_url> --token <TOKEN>          │
#  │                                                          │
#  │ 3. تثبيت كخدمة تعمل تلقائياً عند إعادة التشغيل:        │
#  │    sudo ./svc.sh install && sudo ./svc.sh start          │
#  │                                                          │
#  │ 4. تأكد أن مستخدم الـ runner يستطيع:                    │
#  │    - rsync + قراءة/كتابة في /var/www/noorix              │
#  │    - sudo bash deploy/install-frontend.sh (بدون كلمة)    │
#  │    - sudo systemctl reload nginx (بدون كلمة)             │
#  │    مثال: sudo visudo ثم أضف:                             │
#  │    runner ALL=(ALL) NOPASSWD: /bin/bash, /bin/systemctl  │
#  └─────────────────────────────────────────────────────────┘
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Deploy React Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-noorix-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── بناء الواجهة ─────────────────────────────────────
      - name: Build frontend
        run: |
          npm ci
          npm run build
        env:
          CI: false
          VITE_BUILD_ID: ${{ github.sha }}

      # ── نشر الواجهة إلى مجلد Nginx ──────────────────────
      - name: Deploy frontend to Nginx root
        run: |
          tar czf /tmp/noorix-frontend.tar.gz -C dist .
          sudo bash deploy/install-frontend.sh /tmp/noorix-frontend.tar.gz "${{ github.sha }}"
          rm -f /tmp/noorix-frontend.tar.gz

      # ── تحديث الخلفية وإعادة بنائها في مسار الإنتاج ────
      - name: Sync backend & deploy scripts to production path
        run: |
          PROD=/var/www/noorix/backend

          # نقل سكريبتات deploy (يُصلح مشكلة بقاء النسخ القديمة على السيرفر)
          rsync -a deploy/ /var/www/noorix/deploy/

          # مزامنة كود الـ backend (بدون node_modules/dist/.env)
          rsync -a --delete \
            --exclude='node_modules' --exclude='dist' --exclude='.env' \
            backend/ "$PROD/"

      - name: Rebuild & restart backend (via sudo to reach correct PM2 daemon)
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          PROD=/var/www/noorix/backend
          SHA="${DEPLOY_SHA}"

          # تشخيص: من نحن وأي عمليات PM2 تعمل الآن
          echo "==> runner user: $(whoami)"
          PM2BIN="$(which pm2 2>/dev/null || echo '/usr/local/bin/pm2')"
          echo "==> pm2 path: $PM2BIN"

          echo "==> PM2 processes BEFORE (runner context):"
          "$PM2BIN" list 2>/dev/null || true

          echo "==> PM2 processes BEFORE (sudo/root context):"
          sudo "$PM2BIN" list 2>/dev/null || true

          # إيقاف وحذف جميع نسخ المشروع من كلا السياقين
          echo "==> إيقاف العمليات القديمة"
          "$PM2BIN"      stop  noorix-backend 2>/dev/null || true
          "$PM2BIN"      delete noorix-backend 2>/dev/null || true
          "$PM2BIN"      stop  noorix-api     2>/dev/null || true
          "$PM2BIN"      delete noorix-api     2>/dev/null || true
          sudo "$PM2BIN" stop  noorix-backend 2>/dev/null || true
          sudo "$PM2BIN" delete noorix-backend 2>/dev/null || true
          sudo "$PM2BIN" stop  noorix-api     2>/dev/null || true
          sudo "$PM2BIN" delete noorix-api     2>/dev/null || true
          sleep 3

          # بناء الـ backend
          cd "$PROD"
          echo "==> npm ci"
          rm -rf node_modules
          npm ci

          echo "==> prisma generate"
          npx prisma generate \
            || (sleep 5; npx prisma generate) \
            || (sleep 5; npx prisma generate)

          echo "==> prisma migrate deploy (فشله لا يوقف النشر)"
          bash ../deploy/prisma-migrate-deploy-with-recovery.sh || echo "WARN: migration failed — continuing"

          echo "==> npm run build"
          npm run build

          # بدء PM2 نظيف — نجرّب بدون sudo أولاً ثم بـ sudo للتأكد
          echo "==> pm2 start (runner context)"
          DEPLOY_SHA="$SHA" "$PM2BIN" start ecosystem.config.cjs --update-env || true
          "$PM2BIN" save --force 2>/dev/null || true

          echo "==> PM2 list after start:"
          "$PM2BIN" list 2>/dev/null || true

          # إذا كانت العملية غير موجودة (ربما root يملك PM2) — نجرّب sudo
          if ! "$PM2BIN" list 2>/dev/null | grep -q 'noorix-backend'; then
            echo "==> runner PM2 لا يحتوي noorix-backend — نحاول sudo PM2"
            sudo DEPLOY_SHA="$SHA" "$PM2BIN" stop  noorix-backend 2>/dev/null || true
            sudo DEPLOY_SHA="$SHA" "$PM2BIN" delete noorix-backend 2>/dev/null || true
            sudo DEPLOY_SHA="$SHA" "$PM2BIN" start "$PROD/ecosystem.config.cjs" --update-env
            sudo "$PM2BIN" save --force
            echo "==> PM2 list (sudo) after start:"
            sudo "$PM2BIN" list
          fi

      # ── انتظار جاهزية الـ API ─────────────────────────────
      - name: Wait for API liveness & verify staff route
        run: |
          PM2BIN="$(which pm2 2>/dev/null || echo '/usr/local/bin/pm2')"
          API_PORT=3000
          if [ -f /var/www/noorix/backend/.env ]; then
            p=$(sed -n 's/^[[:space:]]*PORT[[:space:]]*=[[:space:]]*//p' \
              /var/www/noorix/backend/.env | head -1 | tr -d '\r')
            p=$(echo "$p" | tr -d '[:space:]')
            case "$p" in ''|*[!0-9]*) ;; *) API_PORT=$p ;; esac
          fi
          echo "==> Waiting for liveness on port ${API_PORT}..."
          ready=0
          for i in $(seq 1 90); do
            if curl -sS -f -o /dev/null --connect-timeout 2 --max-time 3 \
                "http://127.0.0.1:${API_PORT}/api/v1/health/live" 2>/dev/null; then
              echo "==> API ready after ${i}s"
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "ERROR: timeout 90s" >&2
            "$PM2BIN" logs noorix-backend --lines 80 --nostream 2>&1 | tail -80
            sudo "$PM2BIN" logs noorix-backend --lines 80 --nostream 2>&1 | tail -80
            exit 1
          fi

          # التحقق من وجود مسار الموظفين — يجب ألا يُعيد 404
          echo "==> Checking staff route (must NOT be 404)..."
          STAFF_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -X POST "http://127.0.0.1:${API_PORT}/api/v1/orders/staff" \
            -H "Content-Type: application/json" -d '{}' 2>/dev/null || echo "000")
          echo "==> POST /api/v1/orders/staff → HTTP $STAFF_STATUS"
          if [ "$STAFF_STATUS" = "404" ] || [ "$STAFF_STATUS" = "000" ]; then
            echo "ERROR: مسار الموظفين لا يزال 404 — الـ backend لا يعمل بالكود الجديد!" >&2
            "$PM2BIN" list 2>/dev/null || true
            sudo "$PM2BIN" list 2>/dev/null || true
            "$PM2BIN" logs noorix-backend --lines 50 --nostream 2>&1 | tail -50
            sudo "$PM2BIN" logs noorix-backend --lines 50 --nostream 2>&1 | tail -50
            exit 1
          fi
          echo "==> Staff route OK (HTTP $STAFF_STATUS — 401/400/403 expected) ✓"

      # ── إعادة تحميل Nginx وفحص نهائي ─────────────────────
      - name: Reload Nginx & final health check
        run: |
          sudo systemctl reload nginx
          echo "==> Public health check..."
          BODY=$(curl -sS -f --max-time 30 "https://hajrix.com/api/v1/health" || echo '{}')
          echo "$BODY" | head -c 500
          echo ""
          EXPECTED="${{ github.sha }}"
          if echo "$BODY" | grep -q "$EXPECTED"; then
            echo "==> SHA verified: backend running new code ✓"
          else
            echo "WARNING: SHA mismatch — backend may be cached. Check pm2 logs."
          fi
          echo "==> Deployment completed successfully."
