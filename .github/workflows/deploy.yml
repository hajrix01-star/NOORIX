# نشر الواجهة: أرشيف من الـ runner → SCP (OpenSSH + إعادة محاولة) → سكربت على السيرفر.
# بدون appleboy لتفادي أعطال الـ action وتحسين: انتظار فتح المنفذ، TCP keepalive، عدة محاولات SCP/SSH.
name: Deploy React Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-noorix-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          CI: false
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Pack frontend tarball
        run: tar czf noorix-frontend.tar.gz -C dist .

      - name: Upload tarball and remote install (SSH wait + retries)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_KEY:-}" ]; then
            echo "ERROR: GitHub secrets VPS_HOST / VPS_USERNAME / VPS_SSH_KEY must be set."
            exit 1
          fi
          PORT="$(printf '%s' "${VPS_PORT:-22}" | tr -d '[:space:]\r')"
          if [ -z "$PORT" ]; then PORT=22; fi
          mkdir -p ~/.ssh
          KEY="$HOME/.ssh/noorix_ci_deploy_key"
          printf '%s\n' "$VPS_KEY" > "$KEY"
          chmod 600 "$KEY"

          # scp: -P للمنفذ | ssh: -p للمنفذ
          COMMON_SCP_OPTS=( -4 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=20 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes -o ConnectTimeout=50 -i "$KEY" -P "$PORT" )
          COMMON_SSH_OPTS=( -4 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=20 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes -o ConnectTimeout=50 -i "$KEY" -p "$PORT" )

          # فحص TCP على IPv4 صريح: /dev/tcp بالاسم قد يجرّب IPv6 أولاً فيتعطل بينما ssh -4 ينجح لاحقاً
          WAIT_HOST="${VPS_HOST}"
          IP_LINE="$(getent ahostsv4 "${VPS_HOST}" 2>/dev/null | awk '/STREAM/ {print $1; exit}' || true)"
          if [[ "${IP_LINE:-}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            WAIT_HOST="${IP_LINE}"
            echo "==> TCP wait uses IPv4 address ${WAIT_HOST} (host: ${VPS_HOST})"
          else
            echo "==> TCP wait uses hostname ${VPS_HOST} (no ahostsv4 STREAM — check DNS A record)"
          fi

          tcp_probe() {
            if command -v nc >/dev/null 2>&1; then
              nc -z -w 5 -4 "${WAIT_HOST}" "${PORT}" 2>/dev/null && return 0
            fi
            if timeout 6 bash -c "exec 3<>/dev/tcp/${WAIT_HOST}/${PORT}" 2>/dev/null; then
              exec 3<&- 3>&- 2>/dev/null || true
              return 0
            fi
            return 1
          }

          echo "==> Waiting for TCP ${WAIT_HOST}:${PORT} (GitHub runner → VPS, up to ~8 min)..."
          tcp_ok=0
          for i in $(seq 1 120); do
            if tcp_probe; then
              tcp_ok=1
              break
            fi
            if [ $((i % 25)) -eq 1 ]; then
              echo "  ... still waiting ($i/120) — open inbound TCP ${PORT} on this host to GitHub Actions, or use a self-hosted runner."
            fi
            sleep 2
          done
          if [ "$tcp_ok" != 1 ]; then
            echo "ERROR: ${WAIT_HOST}:${PORT} unreachable from this runner."
            echo "==> DNS / IPv4 hint:"
            getent ahostsv4 "${VPS_HOST}" 2>/dev/null | head -5 || true
            exit 1
          fi
          echo "==> Port open, starting SCP..."

          for attempt in $(seq 1 8); do
            echo "==> SCP attempt ${attempt}/8"
            if scp "${COMMON_SCP_OPTS[@]}" noorix-frontend.tar.gz "${VPS_USER}@${VPS_HOST}:/tmp/"; then
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "ERROR: SCP failed after 8 attempts."
              exit 1
            fi
            echo "  sleeping 40s..."
            sleep 40
          done

          for attempt in $(seq 1 6); do
            echo "==> Remote install attempt ${attempt}/6"
            if [ "$attempt" -gt 1 ]; then
              echo "==> Re-SCP tarball (retry after failure)"
              if ! scp "${COMMON_SCP_OPTS[@]}" noorix-frontend.tar.gz "${VPS_USER}@${VPS_HOST}:/tmp/"; then
                echo "ERROR: re-SCP failed on attempt ${attempt}"
                if [ "$attempt" -eq 6 ]; then exit 1; fi
                sleep 30
                continue
              fi
            fi
            if ssh "${COMMON_SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}" "export DEPLOY_SHA='${DEPLOY_SHA}'; bash -s" < deploy/ci-remote-install.sh; then
              echo "==> Done."
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "ERROR: Remote install failed after 6 attempts."
              exit 1
            fi
            echo "  sleeping 45s..."
            sleep 45
          done
          echo "ERROR: Remote install loop ended without success."
          exit 1
