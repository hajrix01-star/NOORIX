# نشر الواجهة: أرشيف من الـ runner → SCP → install-frontend.sh (مسار واحد على السيرفر).
# لا يُبنى SPA على السيرفر في هذا الـ workflow؛ تجنّب ازدواجية مع dist داخل /var/www/noorix فقط.
name: Deploy React Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # LTS للبناء؛ إجراءات checkout/setup-node v5 تعمل على Node 24 داخلياً وتزيل تحذير إهلاك Node 20
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          CI: false
          VITE_BUILD_ID: ${{ github.sha }}

      # أرشيف كامل لـ dist؛ النشر الفعلي يتم على السيرفر عبر deploy/install-frontend.sh (مسار واحد: /etc/noorix/frontend-root أو الافتراضي).
      - name: Pack frontend tarball
        run: tar czf noorix-frontend.tar.gz -C dist .

      - name: Upload frontend tarball to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          protocol: tcp4
          timeout: 3m
          command_timeout: 15m
          source: noorix-frontend.tar.gz
          target: /tmp/

      # فرض IPv4 يقلّل أعطال الاتصال عبر IPv6. المنفذ: Secret VPS_SSH_PORT (اختياري، الافتراضي 22).
      - name: Install frontend on VPS, backend pull, migrate, build, PM2 + reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          protocol: tcp4
          timeout: 3m
          command_timeout: 25m
          script: |
            set -e
            echo "==> Deploy host: $(hostname) user: $(whoami)"
            if ! sudo -n true 2>/dev/null; then
              echo "ERROR: مستخدم النشر يحتاج sudo بدون كلمة مرور (Defaults !requiretty + NOPASSWD لأوامر النشر)، أو شغّل الـ deploy بمستخدم لديه ذلك."
              exit 1
            fi
            if [ ! -f /tmp/noorix-frontend.tar.gz ]; then
              echo "ERROR: /tmp/noorix-frontend.tar.gz missing — SCP step did not upload the frontend archive."
              exit 1
            fi
            file /tmp/noorix-frontend.tar.gz || true
            tar tzf /tmp/noorix-frontend.tar.gz >/dev/null
            # بدون هذا المسار لن يُحدَّث الباكند — الفشل هنا يوضح في GitHub Actions أن السيرفر غير مربوط
            if [ ! -d /var/www/noorix ]; then
              echo "ERROR: /var/www/noorix not found. Clone the repo there and set up .env, or set NOORIX_ROOT on the server."
              exit 1
            fi
            cd /var/www/noorix
            # يطابق السيرفر مع origin/main (الملفات غير المتتبعة مثل .env لا تُحذف)
            git fetch origin main
            if git rev-parse --verify main >/dev/null 2>&1; then
              git checkout -f main
            else
              git checkout -b main origin/main
            fi
            git reset --hard origin/main
            echo "Deployed commit: $(git log -1 --oneline)"
            # الواجهة أولاً (قبل npm ci الطويل) لتقليل نافذة الخطر وتحديث الموقع حتى لو فشل الباكند لاحقاً
            sudo bash deploy/install-frontend.sh /tmp/noorix-frontend.tar.gz ${{ github.sha }}
            rm -f /tmp/noorix-frontend.tar.gz
            (cd backend && rm -rf node_modules && npm ci && npx prisma generate && npx prisma migrate deploy && npm run build)
            (cd backend && pm2 startOrReload ecosystem.config.cjs --update-env)
            pm2 restart hajri-menu --update-env 2>/dev/null || true
            sudo systemctl reload nginx
            echo "Deployment completed successfully!"
