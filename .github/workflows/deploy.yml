name: Deploy React Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          CI: false
          # يظهر في حزمة الواجهة (__BUILD_ID__) لتسهيل التحقق من أن السيرفر يخدم إصدار الـ commit الحالي
          VITE_BUILD_ID: ${{ github.sha }}

      # أرشفة مجلد dist بالكامل ثم رفع أرشيف واحد يضمن نقل assets/ المتداخلة بلا أخطاء glob.
      # على السيرفر: فك + rsync --delete يحذف ملفات الـ hash القديمة التي يبقى المتصفح يحمّلها إن بقي index.html قديماً في الكاش.
      - name: Pack frontend (dist → tarball)
        run: tar czf frontend-dist.tar.gz -C dist .

      # فرض IPv4 يقلّل أعطال "i/o timeout" عندما يحاول الـ runner الاتصال عبر IPv6 وفشل المسار.
      # إذا كان SSH على منفذ غير 22: أضف Secret باسم VPS_SSH_PORT بقيمة المنفذ (مثلاً 2222).
      - name: Upload frontend tarball to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          protocol: tcp4
          timeout: 3m
          command_timeout: 15m
          source: frontend-dist.tar.gz
          target: /tmp/

      - name: Extract frontend on VPS, backend pull, migrate, build, PM2 + reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          protocol: tcp4
          timeout: 3m
          command_timeout: 25m
          script: |
            set -e
            if [ ! -f /tmp/frontend-dist.tar.gz ]; then
              echo "ERROR: /tmp/frontend-dist.tar.gz missing — SCP step did not upload the frontend archive."
              exit 1
            fi
            if ! command -v rsync >/dev/null 2>&1; then
              echo "ERROR: rsync is required on the VPS for atomic frontend deploy (install: apt install rsync)."
              exit 1
            fi
            FRONT_TMP=$(mktemp -d)
            tar xzf /tmp/frontend-dist.tar.gz -C "$FRONT_TMP"
            mkdir -p /var/www/hajrix.com
            rsync -a --delete "$FRONT_TMP"/ /var/www/hajrix.com/
            rm -rf "$FRONT_TMP" /tmp/frontend-dist.tar.gz
            echo "Frontend deployed to /var/www/hajrix.com (rsync --delete, commit ${{ github.sha }})"
            # بدون هذا المسار لن يُحدَّث الباكند — الفشل هنا يوضح في GitHub Actions أن السيرفر غير مربوط
            if [ ! -d /var/www/noorix ]; then
              echo "ERROR: /var/www/noorix not found. Clone the repo there and set up .env, or set NOORIX_ROOT on the server."
              exit 1
            fi
            cd /var/www/noorix
            git pull origin main
            echo "Deployed commit: $(git log -1 --oneline)"
            (cd backend && rm -rf node_modules && npm ci && npx prisma generate && npx prisma migrate deploy && npm run build)
            (cd backend && pm2 startOrReload ecosystem.config.cjs --update-env)
            pm2 restart hajri-menu --update-env 2>/dev/null || true
            sudo systemctl reload nginx
            echo "Deployment completed successfully!"
