# نشر الواجهة: أرشيف من الـ runner → SCP (OpenSSH + إعادة محاولة) → سكربت على السيرفر.
# بدون appleboy لتفادي أعطال الـ action وتحسين: انتظار فتح المنفذ، TCP keepalive، عدة محاولات SCP/SSH.
name: Deploy React Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-noorix-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          CI: false
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Pack frontend tarball
        run: tar czf noorix-frontend.tar.gz -C dist .

      - name: Upload tarball and remote install (SSH wait + retries)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_KEY:-}" ]; then
            echo "ERROR: GitHub secrets VPS_HOST / VPS_USERNAME / VPS_SSH_KEY must be set."
            exit 1
          fi
          PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          KEY="$HOME/.ssh/noorix_ci_deploy_key"
          printf '%s\n' "$VPS_KEY" > "$KEY"
          chmod 600 "$KEY"

          # scp: -P للمنفذ | ssh: -p للمنفذ
          COMMON_SCP_OPTS=( -4 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=20 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes -o ConnectTimeout=50 -i "$KEY" -P "$PORT" )
          COMMON_SSH_OPTS=( -4 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=20 -o ServerAliveCountMax=12 -o TCPKeepAlive=yes -o ConnectTimeout=50 -i "$KEY" -p "$PORT" )

          echo "==> Waiting for TCP ${VPS_HOST}:${PORT} (up to ~10 min, GitHub runner → VPS)..."
          tcp_ok=0
          for i in $(seq 1 150); do
            if timeout 8 bash -c "exec 3<>/dev/tcp/${VPS_HOST}/${PORT}" 2>/dev/null; then
              exec 3<&- 3>&- 2>/dev/null || true
              tcp_ok=1
              break
            fi
            if [ $((i % 20)) -eq 1 ]; then echo "  ... still waiting ($i/150)"; fi
            sleep 3
          done
          if [ "$tcp_ok" != 1 ]; then
            echo "ERROR: ${VPS_HOST}:${PORT} unreachable (timeout). Open SSH in the host firewall / cloud SG for GitHub-hosted runners, or use a self-hosted runner in the same network."
            exit 1
          fi
          echo "==> Port open, starting SCP..."

          for attempt in $(seq 1 8); do
            echo "==> SCP attempt ${attempt}/8"
            if scp "${COMMON_SCP_OPTS[@]}" noorix-frontend.tar.gz "${VPS_USER}@${VPS_HOST}:/tmp/"; then
              break
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "ERROR: SCP failed after 8 attempts."
              exit 1
            fi
            echo "  sleeping 40s..."
            sleep 40
          done

          for attempt in $(seq 1 6); do
            echo "==> Remote install attempt ${attempt}/6"
            if ssh "${COMMON_SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}" "export DEPLOY_SHA='${DEPLOY_SHA}'; bash -s" < deploy/ci-remote-install.sh; then
              echo "==> Done."
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "ERROR: Remote install failed after 6 attempts."
              exit 1
            fi
            echo "  sleeping 45s..."
            sleep 45
          done
