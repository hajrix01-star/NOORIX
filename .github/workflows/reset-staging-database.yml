name: Reset Staging Database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESET_NOORIX_STAGING to erase only the isolated staging schema"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reset-noorix-staging
  cancel-in-progress: false

jobs:
  reset-staging:
    if: github.event.inputs.confirmation == 'RESET_NOORIX_STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected recovery revision
        uses: actions/checkout@v7

      - name: Reset the isolated staging schema
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USERNAME }}
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_PORT: ${{ secrets.STAGING_SSH_PORT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail

          DEPLOY_HOST="${STAGING_HOST:-${VPS_HOST:-}}"
          DEPLOY_USER="${STAGING_USER:-${VPS_USER:-}}"
          DEPLOY_KEY="${STAGING_KEY:-${VPS_KEY:-}}"
          DEPLOY_PORT="${STAGING_PORT:-${VPS_PORT:-22}}"
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_USER:-}" ] || [ -z "${DEPLOY_KEY:-}" ]; then
            echo "ERROR: staging SSH credentials are unavailable." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          KEY="$HOME/.ssh/noorix_staging_reset_key"
          printf '%s\n' "$DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=12 -o ConnectTimeout=30 \
            -i "$KEY" -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_ROOT=/var/www/noorix-staging
          BACKEND_ROOT="$APP_ROOT/backend"
          SERVICE_NAME=noorix-staging-backend

          test -d "$BACKEND_ROOT"
          test -f "$BACKEND_ROOT/.env"
          test -f "$BACKEND_ROOT/prisma/schema.prisma"
          cd "$BACKEND_ROOT"

          DATABASE_URL="$(node -e 'require("dotenv").config({path:".env",quiet:true}); process.stdout.write(process.env.DATABASE_URL || "")')"
          case "$DATABASE_URL" in
            *noorix_staging*) ;;
            *) echo "ERROR: refusing to reset a database other than noorix_staging." >&2; exit 1 ;;
          esac

          sudo systemctl stop "$SERVICE_NAME" || true
          npx prisma migrate reset --force --skip-seed
          REMOTE
