# نشر الواجهة عبر SSH — بديل عند توقف self-hosted runner
# يستخدم الأسرار الموجودة: VPS_HOST, VPS_USERNAME, VPS_SSH_KEY
# لا يشارك concurrency مع deploy.yml العالق في queued.

name: Deploy Frontend (SSH)

on:
  workflow_dispatch:

concurrency:
  group: deploy-ssh-fallback
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build frontend
        run: |
          npm ci
          npm run build
        env:
          CI: false
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Pack frontend tarball
        run: tar czf noorix-frontend.tar.gz -C dist .

      - name: Upload tarball and install frontend on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_KEY:-}" ]; then
            echo "ERROR: ضبط VPS_HOST / VPS_USERNAME / VPS_SSH_KEY في GitHub Secrets."
            exit 1
          fi

          PORT="$(printf '%s' "${VPS_PORT:-22}" | tr -d '[:space:]\r')"
          [ -z "$PORT" ] && PORT=22

          mkdir -p ~/.ssh
          KEY="$HOME/.ssh/noorix_ci_deploy_key"
          printf '%s\n' "$VPS_KEY" > "$KEY"
          chmod 600 "$KEY"

          SCP_OPTS=( -o BatchMode=yes -o StrictHostKeyChecking=accept-new
                     -o ServerAliveInterval=20 -o ServerAliveCountMax=12
                     -o ConnectTimeout=30 -i "$KEY" -P "$PORT" )
          SSH_OPTS=( -o BatchMode=yes -o StrictHostKeyChecking=accept-new
                     -o ServerAliveInterval=20 -o ServerAliveCountMax=12
                     -o ConnectTimeout=30 -i "$KEY" -p "$PORT" )

          echo "==> Target: ${VPS_USER}@${VPS_HOST}:${PORT}"

          for attempt in $(seq 1 5); do
            echo "==> SCP attempt ${attempt}/5"
            if scp "${SCP_OPTS[@]}" noorix-frontend.tar.gz "${VPS_USER}@${VPS_HOST}:/tmp/noorix-frontend.tar.gz"; then
              break
            fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep 20
          done

          for attempt in $(seq 1 4); do
            echo "==> Frontend install attempt ${attempt}/4"
            if ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}" \
                "export DEPLOY_SHA='${DEPLOY_SHA}'; bash -s" < deploy/ci-frontend-only.sh; then
              echo "==> SSH frontend deploy completed."
              exit 0
            fi
            [ "$attempt" -eq 4 ] && exit 1
            scp "${SCP_OPTS[@]}" noorix-frontend.tar.gz "${VPS_USER}@${VPS_HOST}:/tmp/noorix-frontend.tar.gz" || true
            sleep 30
          done

      - name: Verify public build tag
        run: |
          BUILD="$(curl -sS --max-time 25 'https://hajrix.com/' | sed -n 's/.*name="noorix-build" content="\([^"]*\)".*/\1/p' | head -1)"
          echo "Live noorix-build: ${BUILD:-<missing>}"
          echo "Expected: ${{ github.sha }}"
          if [ -z "$BUILD" ]; then
            echo "WARN: noorix-build not found on homepage"
            exit 1
          fi
          case "$BUILD" in
            *"${{ github.sha }}"*) echo "OK: production matches deployed SHA" ;;
            *) echo "WARN: live build differs from this deploy SHA" ; exit 1 ;;
          esac
