name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm install

      - run: npm install --prefix backend

      - run: npm run verify:git-cleanliness -- --strict

      - run: npm run check:service-footprint

      - run: npm run check:scripts

      - run: npm run check:table-governance

      - run: npm run check:css-governance

      - run: npm run check:inline-style-governance

      - run: npm run audit:large-files

      - run: npm run build

      - run: npm run build --prefix backend

      - run: npm run test:financial

      - run: npm test
