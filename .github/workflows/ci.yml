name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm install --prefix backend

      - run: npm run verify:git-cleanliness -- --strict

      - run: npm run check:service-footprint

      - run: npm run check:scripts

      - run: npm run build

      - run: npm run build --prefix backend

      - run: npm run test:financial

      - run: npm test
