name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm ci

      - run: npm ci --prefix backend

      - run: npm run verify:git-cleanliness -- --strict

      - run: npm run check:service-footprint

      - run: npm run check:scripts

      - run: npm run check:workflow-governance

      - run: npm run check:system-governance-consolidated

      - run: npm run check:css-governance

      - run: npm run check:inline-style-governance

      - run: npm run audit:large-files

      - run: npm run build

      - run: npm run build --prefix backend

      - run: npm test --prefix backend

      - run: npm test
