name: Database Backup → Google Drive (VPS)

on:
  schedule:
    - cron: '0 2 * * *'   # كل يوم الساعة 2 صباحاً UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Backup via SSH & upload to Google Drive
        env:
          VPS_HOST:          ${{ secrets.VPS_HOST }}
          VPS_USER:          ${{ secrets.VPS_USER }}
          VPS_SSH_KEY:       ${{ secrets.VPS_SSH_KEY }}
          VPS_DB_PASSWORD:   ${{ secrets.VPS_DB_PASSWORD }}
          VPS_DB_NAME:       ${{ secrets.VPS_DB_NAME || 'noorix' }}
          VPS_DB_USER:       ${{ secrets.VPS_DB_USER || 'postgres' }}
          GDRIVE_SCRIPT_URL: ${{ secrets.GDRIVE_SCRIPT_URL }}
        run: |
          # ── إعداد مفتاح SSH ──
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          TS=$(date +%Y%m%d_%H%M%S)
          FNAME="noorix_backup_${TS}.dump"
          export FNAME

          # ── تشغيل pg_dump على الـ VPS ونقل الملف ──
          ssh -i ~/.ssh/id_rsa "${VPS_USER}@${VPS_HOST}" \
            "PGPASSWORD='${VPS_DB_PASSWORD}' pg_dump \
              -U ${VPS_DB_USER} \
              -d ${VPS_DB_NAME} \
              --no-owner --no-acl --format=custom \
              --file=/tmp/${FNAME} && gzip -9 /tmp/${FNAME}"

          scp -i ~/.ssh/id_rsa "${VPS_USER}@${VPS_HOST}:/tmp/${FNAME}.gz" "/tmp/${FNAME}.gz"

          # ── حذف الملف من الـ VPS ──
          ssh -i ~/.ssh/id_rsa "${VPS_USER}@${VPS_HOST}" "rm -f /tmp/${FNAME}.gz"

          # ── رفع إلى Google Drive ──
          python3 - <<'PYEOF'
          import os, base64, json
          import urllib.request

          fname  = os.environ['FNAME'] + '.gz'
          script = os.environ['GDRIVE_SCRIPT_URL']

          with open(f'/tmp/{fname}', 'rb') as f:
              content_b64 = base64.b64encode(f.read()).decode()

          payload = json.dumps({
              'filename': fname,
              'content':  content_b64,
              'company':  'full_database',
          }).encode()

          req = urllib.request.Request(
              script,
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=120) as resp:
              result = json.loads(resp.read())

          if result.get('ok'):
              print(f"✅ Saved: {result['saved']}")
          else:
              print(f"❌ Upload failed: {result.get('error')}")
              raise SystemExit(1)
          PYEOF
