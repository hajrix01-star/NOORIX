name: Database Backup → Google Drive
#
# Self-Hosted Runner: يعمل مباشرة على الـ VPS → pg_dump محلي، لا SSH لازم.
# نفس إعداد الـ runner الموثّق في deploy.yml.
#
# Secrets المطلوبة:
#   VPS_DB_PASSWORD   — كلمة مرور قاعدة البيانات
#   VPS_DB_NAME       — اسم القاعدة (افتراضي: noorix)
#   VPS_DB_USER       — مستخدم postgres (افتراضي: postgres)
#   GDRIVE_SCRIPT_URL — رابط Google Apps Script للرفع

on:
  schedule:
    - cron: '0 2 * * *'   # كل يوم الساعة 2 صباحاً UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Backup DB & upload to Google Drive
        env:
          VPS_DB_PASSWORD:   ${{ secrets.VPS_DB_PASSWORD }}
          VPS_DB_NAME:       ${{ secrets.VPS_DB_NAME || 'noorix' }}
          VPS_DB_USER:       ${{ secrets.VPS_DB_USER || 'postgres' }}
          GDRIVE_SCRIPT_URL: ${{ secrets.GDRIVE_SCRIPT_URL }}
        run: |
          set -euo pipefail

          TS=$(date +%Y%m%d_%H%M%S)
          FNAME="noorix_backup_${TS}.dump"
          export FNAME

          echo "==> pg_dump → /tmp/${FNAME}"
          PGPASSWORD="${VPS_DB_PASSWORD}" pg_dump \
            -U "${VPS_DB_USER}" -d "${VPS_DB_NAME}" \
            --no-owner --no-acl --format=custom \
            --file="/tmp/${FNAME}"

          echo "==> gzip"
          gzip -9 "/tmp/${FNAME}"

          echo "==> Upload to Google Drive"
          python3 - <<'PYEOF'
          import os, base64, json
          import urllib.request

          fname  = os.environ['FNAME'] + '.gz'
          script = os.environ['GDRIVE_SCRIPT_URL']

          with open(f'/tmp/{fname}', 'rb') as f:
              content_b64 = base64.b64encode(f.read()).decode()

          payload = json.dumps({
              'filename': fname,
              'content':  content_b64,
              'company':  'full_database',
          }).encode()

          req = urllib.request.Request(
              script,
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=120) as resp:
              result = json.loads(resp.read())

          if result.get('ok'):
              print(f"✅ Saved: {result['saved']}")
          else:
              print(f"❌ Upload failed: {result.get('error')}")
              raise SystemExit(1)
          PYEOF

          rm -f "/tmp/${FNAME}.gz"
          echo "==> Backup done."
