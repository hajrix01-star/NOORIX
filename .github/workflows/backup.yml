name: Database Backup → Google Drive (VPS)
#
# يتصل بـ Tailscale أولاً ثم يشغّل pg_dump على الـ VPS عبر SSH.
# يحتاج نفس إعداد Tailscale الموثّق في deploy.yml.
# Secrets المطلوبة: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, VPS_TS_HOST,
#                   VPS_USER, VPS_SSH_KEY, VPS_DB_PASSWORD,
#                   VPS_DB_NAME (افتراضي: noorix), VPS_DB_USER (افتراضي: postgres),
#                   GDRIVE_SCRIPT_URL

on:
  schedule:
    - cron: '0 2 * * *'   # كل يوم الساعة 2 صباحاً UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Backup via SSH & upload to Google Drive
        env:
          VPS_TS_HOST:       ${{ secrets.VPS_TS_HOST }}
          VPS_USER:          ${{ secrets.VPS_USER }}
          VPS_SSH_KEY:       ${{ secrets.VPS_SSH_KEY }}
          VPS_DB_PASSWORD:   ${{ secrets.VPS_DB_PASSWORD }}
          VPS_DB_NAME:       ${{ secrets.VPS_DB_NAME || 'noorix' }}
          VPS_DB_USER:       ${{ secrets.VPS_DB_USER || 'postgres' }}
          GDRIVE_SCRIPT_URL: ${{ secrets.GDRIVE_SCRIPT_URL }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_TS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "ERROR: يجب ضبط VPS_TS_HOST / VPS_USER / VPS_SSH_KEY في GitHub Secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          KEY="$HOME/.ssh/noorix_backup_key"
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"

          SSH_OPTS=( -o BatchMode=yes -o StrictHostKeyChecking=accept-new
                     -o ConnectTimeout=30 -o ServerAliveInterval=20
                     -i "$KEY" )

          TS=$(date +%Y%m%d_%H%M%S)
          FNAME="noorix_backup_${TS}.dump"
          export FNAME

          # pg_dump على VPS
          ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_TS_HOST}" \
            "PGPASSWORD='${VPS_DB_PASSWORD}' pg_dump \
              -U ${VPS_DB_USER} -d ${VPS_DB_NAME} \
              --no-owner --no-acl --format=custom \
              --file=/tmp/${FNAME} && gzip -9 /tmp/${FNAME}"

          # نقل الملف
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 -i "$KEY" \
              "${VPS_USER}@${VPS_TS_HOST}:/tmp/${FNAME}.gz" "/tmp/${FNAME}.gz"

          # حذف الملف من VPS
          ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_TS_HOST}" "rm -f /tmp/${FNAME}.gz"

          # رفع إلى Google Drive
          python3 - <<'PYEOF'
          import os, base64, json
          import urllib.request

          fname  = os.environ['FNAME'] + '.gz'
          script = os.environ['GDRIVE_SCRIPT_URL']

          with open(f'/tmp/{fname}', 'rb') as f:
              content_b64 = base64.b64encode(f.read()).decode()

          payload = json.dumps({
              'filename': fname,
              'content':  content_b64,
              'company':  'full_database',
          }).encode()

          req = urllib.request.Request(
              script,
              data=payload,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=120) as resp:
              result = json.loads(resp.read())

          if result.get('ok'):
              print(f"✅ Saved: {result['saved']}")
          else:
              print(f"❌ Upload failed: {result.get('error')}")
              raise SystemExit(1)
          PYEOF
