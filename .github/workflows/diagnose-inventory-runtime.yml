name: Diagnose Inventory Runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-inventory-runtime.yml

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Read recent inventory backend errors
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(sudo journalctl -u noorix-backend --since "2 hours ago" --no-pager \
            | grep -E -A30 -B4 'HttpExceptionFilter|OrdersInventoryService|recipe-inventory-stock|Unhandled:|PrismaKnown' \
            | tail -n 240 \
            || true)"
          printf '%s\n' "$LOG"
          SAFE="${LOG//'%'/'%25'}"
          SAFE="${SAFE//$'\r'/'%0D'}"
          SAFE="${SAFE//$'\n'/'%0A'}"
          printf '::notice title=Inventory runtime log::%s\n' "$SAFE"
