name: Diagnose Inventory Runtime

on:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Read recent inventory projection failures
        shell: bash
        run: |
          sudo journalctl -u noorix-backend --since "20 minutes ago" --no-pager \
            | grep -E 'Missing inventory conversion|recipe-inventory-stock|HttpExceptionFilter|Unhandled' \
            | tail -160 \
            || true
